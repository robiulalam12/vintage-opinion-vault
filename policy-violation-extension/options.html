<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Policy Violation settings</title><style>body{margin:0;padding:28px;background:#f1f3f4;font:14px/1.5 Arial,sans-serif;color:#202124}.card{max-width:580px;margin:auto;padding:24px;background:white;border:1px solid #dadce0;border-radius:8px}h1{margin:0 0 4px}p{color:#5f6368}label{display:block;margin:14px 0 4px;font-size:11px;text-transform:uppercase;color:#5f6368}input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #dadce0;border-radius:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{margin-top:18px;padding:10px 18px;border:0;border-radius:5px;background:#b3261e;color:white;font-weight:bold}</style></head><body><div class="card"><h1>Policy Violation settings</h1><p>These details identify you on Google's legal removal form. “Myself” is always selected.</p><label for="apiBase">Dashboard URL</label><input id="apiBase"><label for="apiKey">Extension API key</label><input id="apiKey" type="password" placeholder="Same key as the DMCA extension"><div class="row"><div><label for="country">Country of residence</label><input id="country"></div><div><label for="fullName">Full legal name and signature</label><input id="fullName"></div></div><label for="twoCaptchaKey">2Captcha API key</label><input id="twoCaptchaKey" type="password"><label for="submitDelay">Submit countdown (seconds)</label><input id="submitDelay" type="number" min="2" max="60"><button id="save">Save settings</button><span id="status" style="margin-left:10px;color:#188038"></span></div><script src="config.js"></script><script src="options.js"></script></body></html>
