<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>POB Session Capture</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 340px; padding: 14px; margin: 0; background: #ffffff; color: #0f172a; }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p.hint { font-size: 12px; color: #64748b; margin: 0 0 10px; line-height: 1.4; }
      button { width: 100%; margin-top: 8px; padding: 9px 12px; font-size: 13px; font-weight: 600; background: #0f172a; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
      button.secondary { background: #e2e8f0; color: #0f172a; }
      button:hover { filter: brightness(0.95); }
      .status { margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 12px; line-height: 1.4; }
      .status.ok { background: #ecfdf5; color: #065f46; }
      .status.err { background: #fef2f2; color: #991b1b; }
      .status.info { background: #f1f5f9; color: #334155; }
      .toggle { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: #334155; }
      .accounts { margin-top: 10px; border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden; }
      .acct { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; font-size: 12px; border-top: 1px solid #f1f5f9; }
      .acct:first-child { border-top: none; }
      .acct .em { color: #0f172a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
      .pill { font-size: 10px; padding: 2px 6px; border-radius: 999px; font-weight: 600; text-transform: uppercase; }
      .pill.captured { background: #d1fae5; color: #065f46; }
      .pill.dead { background: #fee2e2; color: #991b1b; }
      .pill.error { background: #fef3c7; color: #92400e; }
      .pill.skipped { background: #e0e7ff; color: #3730a3; }
      .diag { margin-top: 10px; font-size: 11px; color: #64748b; white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>POB Session Capture <small>v3.2.0</small></h1>
    <p class="hint">Captures every Google account signed into this Chrome profile.</p>

    <label class="toggle"><input type="checkbox" id="autoDisabled" /> Pause auto-capture</label>

    <button id="capture">Capture all accounts now</button>
    <div id="status" class="status info">Idle.</div>
    <div id="accounts" class="accounts" hidden></div>

    <button id="diag" class="secondary">Copy diagnostics</button>
    <div id="diagOut" class="diag"></div>

    <script src="popup.js"></script>
  </body>
</html>
