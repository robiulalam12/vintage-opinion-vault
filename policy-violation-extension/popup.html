<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Policy Violation</title><style>body{margin:0;width:340px;font:13px/1.45 Arial,sans-serif;color:#202124}header,main{padding:14px}header{display:flex;align-items:center;gap:9px;border-bottom:1px solid #dadce0}.mark{display:grid;place-items:center;width:27px;height:27px;background:#b3261e;color:white;border-radius:5px;font-weight:bold}label{display:block;margin:12px 0 4px;color:#5f6368;font-size:11px;text-transform:uppercase}select,button{box-sizing:border-box;width:100%;padding:9px;border:1px solid #dadce0;border-radius:6px;background:#fff}button{margin-top:9px;background:#b3261e;color:#fff;border:0;font-weight:bold;cursor:pointer}button.ghost{background:#fff;color:#202124;border:1px solid #dadce0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}.stat{padding:7px 3px;background:#f1f3f4;border-radius:5px;text-align:center;font-size:10px}.stat b{display:block;font-size:15px}.status{margin-top:10px;white-space:pre-wrap;color:#5f6368}.error{color:#b3261e}</style></head><body><header><span class="mark">P</span><strong>POLICY VIOLATION</strong></header><main><label for="order">Policy order</label><select id="order"><option>Loading…</option></select><div class="stats"><span class="stat"><b id="ready">0</b>Ready</span><span class="stat"><b id="active">0</b>Active</span><span class="stat"><b id="sent">0</b>Sent</span><span class="stat"><b id="blocked">0</b>Blocked</span></div><button id="start">Start reporting</button><button class="ghost" id="pause" hidden>Pause</button><button class="ghost" id="open" hidden>Open run tab</button><button class="ghost" id="stop" hidden>Stop run</button><button class="ghost" id="settings">Settings</button><div class="status" id="status"></div></main><script src="config.js"></script><script src="popup.js"></script></body></html>
